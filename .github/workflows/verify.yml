name: Verify reader and API
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: https://api.henry.ink
      VITE_WORKER_URL: https://bsky-search.henry.ink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chrome
      - run: bun run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-smoke-screenshots
          path: test-results/
          if-no-files-found: ignore
